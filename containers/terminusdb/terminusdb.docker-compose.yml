services:
  terminusdb-server:
    image: terminusdb/terminusdb-server:latest
    container_name: terminusdb-service
    restart: unless-stopped

    ports:
      - "127.0.0.1:9643:6363"

    env_file:
      - path: ${PROJECT_ROOT}/settings/terminusdb.docker-starter.setting
        required: true
      - path: ${PROJECT_ROOT}/settings/terminusdb.docker.setting
        required: false

    volumes:
      - ./data:/app/terminusdb/data:rw

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    init: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev

    networks:
      - terminusdb-net

networks:
  terminusdb-net:
    driver: bridge
