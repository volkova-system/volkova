# Multiple ports for different projects (like your Caddy setup)
server {
    listen 8080;
    server_name localhost;

    # Frontend build files
    location / {
        root C:/Users/YourName/Projects/frontend/dist;
        index index.html;
        autoindex on;  # Directory browsing like Caddy's 'browse'
        try_files $uri $uri/ =404;
    }

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

server {
    listen 8081;
    server_name localhost;

    # Backend static assets
    location / {
        root C:/Users/YourName/Projects/backend/public;
        autoindex on;
        try_files $uri $uri/ =404;
    }
}

# Path-based routing on single port (equivalent to your Caddy setup)
server {
    listen 3000;
    server_name localhost;

    # Frontend app
    location /app/ {
        alias C:/Users/YourName/Projects/frontend/dist/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # API documentation
    location /docs/ {
        alias C:/Users/YourName/Projects/api-docs/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Static assets
    location /static/ {
        alias C:/Users/YourName/Projects/assets/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Root serves simple index
    location = / {
        return 200 '
        <html>
        <body>
            <h1>Local Development Server</h1>
            <ul>
                <li><a href="/app/">Frontend App</a></li>
                <li><a href="/docs/">API Documentation</a></li>
                <li><a href="/static/">Static Assets</a></li>
            </ul>
        </body>
        </html>
        ';
        add_header Content-Type text/html;
    }
}
