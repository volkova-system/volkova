events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Simplified logging format to match Caddy pattern
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Log configuration matching Caddy pattern
    access_log logs/access.log main;
    error_log logs/error.log info;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 5173;
        server_name localhost;

        # Image serving configuration matching Caddy pattern
        location /assets/images/ {
            root $IMAGE_ASSETS_DIRECTORY_PATH;
            try_files $uri /404.svg;

            # Add headers for better caching (following modern web server patterns)
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
