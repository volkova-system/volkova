events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Simplified logging format to match Caddy pattern
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Log configuration matching Caddy pattern
    access_log logs/access.log main;
    error_log logs/error.log info;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 9630;
        server_name localhost;

        # Products component service - proxy to Next.js (most specific first)
        location /service/component/products {
            proxy_pass http://localhost:6039;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Products data service - proxy to Go Fiber
        location /service/data/products {
            proxy_pass http://localhost:4979;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default fallback - proxy everything else to Storybook
        location / {
            proxy_pass http://localhost:3690;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
