<div class="leftbar sidebar spacer"></div>
<section class="page">
    <div class="sidebar spacer"></div>
    <main id="product-list-tree"
        class="content-tree tree list">
        <div class="item spacer"></div>
        <ol id="product-list"
            class="product-list content-tree-list list">
        </ol>
        <product-list
            target="product-list"
            data-state="list"
            data-component-service-address="http://localhost:6039"
            data-component="/service/component/products"
            data-service="/service/data/products">
        </product-list>
        <div class="item spacer"></div>
    </main>
    <div class="sidebar spacer"></div>
    <article id="product-preview-tree"
        class="focus-tree tree list hidden">
        <div class="item spacer"></div>
        <ol id="product-card"
            class="card focus-tree-list list">
        </ol>
        <product-card
            target="product-card"
            data-state="idle"
            data-component-service-address="http://localhost:6039"
            data-component="/service/component/products/product_reference/preview"
            data-service="/service/data/products/product_reference">
        </product-card>
        <div class="item spacer"></div>
    </article>
</section>
<aside id="product-search-tree"
    class="product-search-tree input-tree tree list hidden">
    <div class="item spacer"></div>
    <ol id="product-search-list"
        class="input-tree-list list">
        <li class="input-tree-item item">
            <button class="icon-control control"
                aria-label="expand product search panel"
                _="
                    on click
                        add .hidden to #product-search-tree
                        remove .hidden from #product-search-tree-idle
                        set @data-state of <product-list/> to 'list'
                ">
                <svg class="icon">
                    <use href="/assets/images/feather-sprite.svg#chevron-right" />
                </svg>
            </button>
            <div class="content">
                <input id="search-product-query" type="text"
                    placeholder="Search products"/>
            </div>
            <button class="icon-control control"
                aria-label="search products"
                _="
                    on click
                        set query to #search-product-query.value
                        set @data-state of <product-list/> to 'search'
                        set @data-service of <product-list/> to '/service/data/products/search?query=' + query
                ">
                <svg class="icon">
                    <use href="/assets/images/feather-sprite.svg#search" />
                </svg>
            </button>
        </li>
        <li class="normal-spacing item spacer"></li>
        <li class="input-tree-item item">
            <div class="spacer"></div>
            <div class="content">
                Sort products
            </div>
            <button class="icon-control control"
                aria-label="sort products"
                _="">
                <svg class="icon">
                    <use href="/assets/images/feather-sprite.svg#more-vertical" />
                </svg>
            </button>
        </li>
        <li class="normal-spacing item spacer"></li>
        <li class="input-tree-item item">
            <div class="spacer"></div>
            <div class="content">
                Filter products
            </div>
            <button class="icon-control control"
                aria-label="sort products"
                _="">
                <svg class="icon">
                    <use href="/assets/images/feather-sprite.svg#more-vertical" />
                </svg>
            </button>
        </li>
    </ol>
    <div class="item spacer"></div>
</aside>
<aside id="product-sort-tree"
    class="product-sort-tree input-tree tree list hidden">
    <div class="item spacer"></div>
    <ol id="product-sort-list"
        class="input-tree-list list">
    </ol>
    <product-sort
        target="product-sort-list"
        data-state="idle"
        data-component-service-address="http://localhost:6039"
        data-component="/service/component/products/sort/criteria"
        data-service="/service/data/products/sort">
    </product-sort>
    <div class="item spacer"></div>
</aside>
<aside id="product-filter-tree"
    class="product-filter-tree input-tree tree list hidden">
    <div class="item spacer"></div>
    <ol id="product-filter-list"
        class="input-tree-list list">
    </ol>
    <product-filter
        target="product-filter-list"
        data-state="idle"
        data-component-service-address="http://localhost:6039"
        data-component="/service/component/products/filter/fields"
        data-service="/service/data/products/filter">
    </product-filter>
    <div class="item spacer"></div>
</aside>
<div id="product-search-tree-idle"
    class="sidebar">
    <div class="spacer"></div>
    <button class="icon-control control"
        aria-label="expand product search panel"
        _="
            on click remove .hidden from #product-search-tree
            on click add .hidden to #product-search-tree-idle
        ">
        <svg class="icon">
            <use href="/assets/images/feather-sprite.svg#search" />
        </svg>
    </button>
</div>
<div class="sidebar spacer"></div>
<div class="rightbar sidebar spacer"></div>
